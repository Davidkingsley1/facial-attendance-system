<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facial Attendance System</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Koffee Lounge Attendance</h1>
      </header>

      <section id="login-section" class="card">
        <h2>Admin Login</h2>
        <form id="login-form">
          <input type="text" id="username" placeholder="Username" required />
          <input type="password" id="password" placeholder="Password" required />
          <button type="submit">Login</button>
        </form>
        <p id="login-message" class="message"></p>
      </section>

      <section id="register-section" class="card hidden">
        <h2>Register Employee</h2>
        <form id="employee-form" enctype="multipart/form-data">
          <input type="text" id="employee_id" placeholder="Employee ID" required />
          <input type="text" id="full_name" placeholder="Full Name" required />
          <input type="text" id="department" placeholder="Department" />
          <input type="text" id="phone" placeholder="Phone" />
          <input type="email" id="email" placeholder="Email" />
          <input type="text" id="role" placeholder="Role" />
          <input type="file" id="image" accept="image/*" required />
          <button type="submit">Register Employee</button>
        </form>
        <p id="employee-message" class="message"></p>
      </section>

      <section id="recognition-section" class="card hidden">
        <h2>Attendance Recognition</h2>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" width="640" height="480" style="display:none"></canvas>
        <div class="button-row">
          <button id="start-camera">Start Camera</button>
          <button id="capture-button">Capture & Recognize</button>
        </div>
        <p id="recognition-message" class="message"></p>
      </section>

      <section id="report-section" class="card hidden">
        <h2>Attendance Report</h2>
        <div class="button-row">
          <input type="date" id="report-date" />
          <button id="load-report">Load Report</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Employee ID</th>
              <th>Name</th>
              <th>Department</th>
              <th>Status</th>
              <th>Clock In</th>
              <th>Clock Out</th>
            </tr>
          </thead>
          <tbody id="report-body"></tbody>
        </table>
      </section>
    </div>

    <script src="/static/script.js"></script>
  </body>
</html>
